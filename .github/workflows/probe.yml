name: PRT Ref Probe
on:
  pull_request_target:
    types: [opened, synchronize, closed]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump event refs
        run: |
          echo "event=${{ github.event_name }} action=${{ github.event.action }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "pr.head.sha=${{ github.event.pull_request.head.sha }}"
          echo "pr.merge_commit_sha=${{ github.event.pull_request.merge_commit_sha }}"
          echo "pr.base.ref=${{ github.event.pull_request.base.ref }}"
          echo "pr.merged=${{ github.event.pull_request.merged }}"
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        id: checkout
        if: github.event.pull_request.merged
        with:
          sparse-checkout: .ci
      - name: Get Current Milestone Name
        id: get-current-milestone
        if: steps.checkout.outcome != 'skipped'
        shell: bash
        run: echo "current_milestone=v$(head -1 CHANGELOG.md | cut -d " " -f 2)" >> "$GITHUB_OUTPUT"
      - name: Add Items to Milestone
        if: steps.checkout.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE: ${{ steps.get-current-milestone.outputs.current_milestone }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: .ci/scripts/probe.sh
